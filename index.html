<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 문서의 문자 인코딩을 UTF-8로 설정합니다. -->
  <meta charset="UTF-8">
  <!-- 모바일 및 다양한 기기 화면에 맞추는 반응형 뷰포트 설정입니다. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 웹 브라우저 탭에 표시될 웹 페이지 제목입니다. -->
  <title>실시간 공기신호등 & 공기지도 - 전국 대기오염 미세먼지</title>
  <!-- 눈이 편안하고 가독성이 뛰어난 Pretendard 웹폰트를 연결합니다. -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <!-- 오픈소스 지도 라이브러리 Leaflet CSS를 불러옵니다. -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- 외부에 정의된 CSS 스타일시트 파일을 연결합니다. -->
  <link rel="stylesheet" href="style.css">
  <!-- 가로 막대 그래프 렌더링을 위한 Chart.js CDN 라이브러리를 불러옵니다. -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- 오픈소스 지도 라이브러리 Leaflet JS를 불러옵니다. -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <!-- 전체 화면 콘텐츠를 감싸는 반응형 컨테이너입니다. -->
  <div class="container">
    
    <!-- 상단 헤더 영역입니다. -->
    <header class="app-header">
      <!-- 서비스 메인 타이틀입니다. -->
      <h1>실시간 공기신호등</h1>
      <!-- 서비스 부제목 설명글입니다. -->
      <p class="subtitle">우리 동네 대기오염 상태를 신호등, 지도, 그래프로 한눈에 확인하세요</p>
    </header>

    <!-- 시도 선택 컨트롤 영역입니다. -->
    <section class="control-section">
      <!-- 드롭다운 라벨입니다. -->
      <label for="sidoSelect">지역(시·도) 선택</label>
      <!-- 17개 시도 및 전국 선택 드롭다운 메뉴입니다. -->
      <select id="sidoSelect">
        <option value="전국">전국</option>
        <option value="서울" selected>서울</option>
        <option value="부산">부산</option>
        <option value="대구">대구</option>
        <option value="인천">인천</option>
        <option value="광주">광주</option>
        <option value="대전">대전</option>
        <option value="울산">울산</option>
        <option value="세종">세종</option>
        <option value="경기">경기</option>
        <option value="강원">강원</option>
        <option value="충북">충북</option>
        <option value="충남">충남</option>
        <option value="전북">전북</option>
        <option value="전남">전남</option>
        <option value="경북">경북</option>
        <option value="경남">경남</option>
        <option value="제주">제주</option>
      </select>
    </section>

    <!-- 맨 위 대표 상태를 아주 크게 보여주는 '공기신호등' 대시보드 카드입니다. -->
    <section id="trafficDashboard" class="traffic-dashboard signal-loading">
      <!-- 선택된 지역 이름 안내 라벨입니다. -->
      <div class="region-badge">
        <span id="selectedRegionName">서울</span> 대표 공기상태
      </div>

      <!-- 이모지(🔵🟢🟠🔴) + 상태(좋음/보통/나쁨/매우나쁨) + 평균 수치를 담는 대형 신호등 표시창입니다. -->
      <div class="traffic-main-display">
        <!-- 신호등 상태 이모지 (크게 표시) -->
        <span id="trafficEmoji" class="traffic-emoji">⏳</span>
        <!-- 상태 텍스트 (좋음/보통/나쁨/매우나쁨) -->
        <span id="trafficGradeText" class="traffic-grade-text">불러오는 중...</span>
        <!-- 평균 미세먼지 수치 -->
        <div class="traffic-value-wrap">
          <span id="trafficAverageValue" class="traffic-average-number">-</span>
          <span class="traffic-unit">㎍/㎥</span>
        </div>
      </div>

      <!-- 그 아래 한 줄 안내 문구 (나쁨 이상이면 '외출 시 마스크를 챙기세요') -->
      <div class="advice-container">
        <p id="actionAdvice" class="action-advice">불러오는 중...</p>
      </div>

      <!-- 최신 측정 기준시각 안내 영역입니다. -->
      <p id="latestTimeInfo" class="latest-time-info"></p>
    </section>

    <!-- 측정소 좌표 기반 인터랙티브 공기지도 섹션 (방독면, 마스크, 기본 얼굴 마커) -->
    <section id="mapSection" class="map-section">
      <div class="map-header">
        <h2>🗺️ <span id="mapRegionName">서울</span> 공기지도</h2>
        <!-- 등급별 얼굴/마스크/방독면 범례 안내 -->
        <div class="map-legend">
          <span class="legend-item"><span class="legend-badge badge-good">😊</span> 좋음</span>
          <span class="legend-item"><span class="legend-badge badge-normal">🙂</span> 보통</span>
          <span class="legend-item"><span class="legend-badge badge-bad">😷</span> 마스크(나쁨)</span>
          <span class="legend-item"><span class="legend-badge badge-very-bad">🤿</span> 방독면(매우나쁨)</span>
        </div>
      </div>
      <!-- Leaflet 지도가 렌더링되는 캔버스 컨테이너입니다. -->
      <div id="airMap" class="air-map-container"></div>
    </section>

    <!-- 미세먼지 상위 10개 측정소 가로 막대 그래프 섹션입니다. -->
    <section id="chartSection" class="chart-section hidden">
      <div class="chart-header">
        <h2>📊 <span id="chartRegionName">서울</span> 미세먼지 농도 상위 10곳</h2>
        <span class="chart-unit-badge">단위: ㎍/㎥</span>
      </div>
      <!-- 차트 캔버스를 반응형으로 감싸는 래퍼입니다. -->
      <div class="chart-wrapper">
        <canvas id="dustChart"></canvas>
      </div>
    </section>

    <!-- 데이터 로딩 인디케이터 ('불러오는 중...' 표시) -->
    <div id="loadingMessage" class="status-message loading">
      <div class="spinner"></div>
      <p>데이터를 불러오는 중...</p>
    </div>

    <!-- 에러 알림 메시지 영역입니다. -->
    <div id="errorMessage" class="status-message error hidden">
      <p id="errorText">데이터를 불러오지 못했습니다.</p>
    </div>

    <!-- 측정소별 카드가 나열되는 반응형 그리드 영역입니다. -->
    <main id="cardContainer" class="card-grid">
      <!-- 자바스크립트로 생성된 측정소별 카드가 여기에 들어갑니다. -->
    </main>

    <!-- 하단 데이터 출처 안내 푸터 영역입니다. -->
    <footer class="app-footer">
      <p>본 데이터는 한국환경공단 에어코리아(AirKorea)에서 제공합니다.</p>
    </footer>

  </div>

  <!-- 자바스크립트 로직 연결 -->
  <script src="script.js"></script>
</body>
</html>
